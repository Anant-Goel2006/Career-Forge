<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cf_top_left" x1="60" y1="10" x2="20" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="cf_top_right" x1="60" y1="10" x2="100" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#4C1D95" />
    </linearGradient>
    <linearGradient id="cf_bottom_left" x1="20" y1="60" x2="60" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#312E81" />
    </linearGradient>
    <linearGradient id="cf_bottom_right" x1="100" y1="60" x2="60" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cf_center_hollow" x1="60" y1="35" x2="60" y2="85" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#050505" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <filter id="cf_glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Faceted Diamond / Prism -->
  <g filter="url(#cf_glow)">
    <!-- Top-Left Facet -->
    <polygon points="60,10 20,60 40,60 60,35" fill="url(#cf_top_left)" />
    <!-- Top-Right Facet -->
    <polygon points="60,10 100,60 80,60 60,35" fill="url(#cf_top_right)" />
    <!-- Bottom-Left Facet -->
    <polygon points="20,60 60,110 60,85 40,60" fill="url(#cf_bottom_left)" />
    <!-- Bottom-Right Facet -->
    <polygon points="100,60 60,110 60,85 80,60" fill="url(#cf_bottom_right)" />
    
    <!-- Central Core Highlight -->
    <polygon points="60,35 40,60 60,85 80,60" fill="url(#cf_center_hollow)" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    
    <!-- Sharp Ridge Reflections -->
    <line x1="60" y1="10" x2="60" y2="35" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
    <line x1="60" y1="85" x2="60" y2="110" stroke="#A78BFA" stroke-width="2" stroke-linecap="round" />
    <line x1="20" y1="60" x2="40" y2="60" stroke="#C4B5FD" stroke-width="1.5" stroke-linecap="round" />
    <line x1="80" y1="60" x2="100" y2="60" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
  </g>
</svg>
