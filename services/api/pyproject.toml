[project]
name = "careerforge-api"
version = "1.0.0"
description = "CareerForge AI — FastAPI Backend Service"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "UNLICENSED" }
dependencies = [
    # ---------- Web Framework ----------
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.17",
    # ---------- Database ----------
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",
    # ---------- Validation & Serialization ----------
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    # ---------- AI / LLM ----------
    "google-genai>=1.0.0",
    # ---------- Document Processing ----------
    "python-docx>=1.1.0",
    "reportlab>=4.2.0",
    "PyMuPDF>=1.25.0",
    "pdfplumber>=0.11.0",
    # ---------- Security & Auth ----------
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.2.0",
    # ---------- Utilities ----------
    "python-magic>=0.4.27",
    "bleach>=6.2.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "factory-boy>=3.3.0",
]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "W", "I", "N", "UP", "S", "B", "A", "C4", "DTZ", "T20", "RET", "SIM"]
ignore = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
